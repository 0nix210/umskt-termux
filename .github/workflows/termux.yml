name: Termux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Releasename"
        required: true
        default: ""

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: i686
            runner: ubuntu-latest
            image: termux/termux-docker:i686
          - arch: x86_64
            runner: ubuntu-latest
            image: termux/termux-docker:x86_64
          - arch: aarch64
            runner: ubuntu-26.04-arm
            image: termux/termux-docker:aarch64
          - arch: armv7
            runner: ubuntu-26.04-arm
            image: termux/termux-docker:arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7
        with:
          repository: umskt/umskt
          ref: ${{ inputs.tag || github.ref }}

      - name: Start Termux container
        run: |
          docker create --name termux --privileged \
            -v "$PWD":/root/umskt -w /root/umskt \
            ${{ matrix.image }} tail -f /dev/null
          docker start termux
          docker exec termux bash -c 'pkg update && pkg upgrade -y && pkg install -y build-essential cmake git openssl zlib zip'

      - name: Build
        run: |
          docker exec termux bash -c 'cd /root/umskt && cmake .. && make'

      - name: Test
        run: |
          docker exec termux bash -c 'cd /root/umskt/build && ./umskt -b 2C -c 365 -s 069420,999999 -v'
          docker exec termux bash -c 'cd /root/umskt/build && ./umskt -b 5A -c 640 -s 069420,999999 -v'
          docker exec termux bash -c 'cd /root/umskt/build && ./umskt -i 253286028742154311079061239762245184619981623171292574'

      - name: Package
        run: |
          mkdir -p release
          zip -j release/umskt-termux-${{ matrix.arch }}.zip build/umskt

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: |
             Source and changelog: https://github.com/UMSKT/UMSKT/releases/tag/${{ inputs.tag }}
          files: release/umskt-termux-${{ matrix.arch }}.zip

      - name: Cleanup
        if: always()
        run: docker rm -f termux

env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}