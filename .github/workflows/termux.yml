name: Termux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Releasename"
        required: true
        default: ""

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: i686
            runner: ubuntu-latest
            image: termux/termux-docker:i686
          - arch: x86_64
            runner: ubuntu-latest
            image: termux/termux-docker:x86_64
          - arch: aarch64
            runner: ubuntu-26.04-arm
            image: termux/termux-docker:aarch64
          - arch: armv7
            runner: ubuntu-26.04-arm
            image: termux/termux-docker:arm
    runs-on: ${{ matrix.runner }}

    steps:

      - name: Start Termux container
        run: |
          docker run -d --name termux \
            -v "$PWD":/data/data/com.termux/files/home \
            -w /data/data/com.termux/files/home \
            ${{ matrix.image }} sleep infinity
          docker start termux
          docker exec -u system termux bash -c 'apt update && apt upgrade -y && apt install -y build-essential cmake git openssl zlib zip'

      - name: Build
        run: |
          docker exec -u system termux bash -c 'git clone https://github.com/UMSKT/UMSKT/archive/refs/tags/${{ inputs.tag }}.zip'
          docker exec -u system termux bash -c 'cd /data/data/com.termux/files/home/UMSKT/build && cmake .. && make'

      - name: Test
        run: |
          docker exec -u system termux bash -c 'cd /data/data/com.termux/files/home/UMSKT/build && ./umskt -b 2C -c 365 -s 069420,999999 -v'
          docker exec -u system termux bash -c 'cd /data/data/com.termux/files/home/UMSKT/build && ./umskt -b 5A -c 640 -s 069420,999999 -v'
          docker exec -u system termux bash -c 'cd /data/data/com.termux/files/home/UMSKT/build && ./umskt -i 253286028742154311079061239762245184619981623171292574'

      - name: Package
        run: |
          mkdir -p release
          docker cp termux:/data/data/com.termux/files/home/UMSKT/build/umskt $GITHUB_WORKSPACE/umskt
          zip -j release/umskt-termux-${{ matrix.arch }}.zip $GITHUB_WORKSPACE/umskt

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: |
             Source and changelog: https://github.com/UMSKT/UMSKT/releases/tag/${{ inputs.tag }}
          files: release/umskt-termux-${{ matrix.arch }}.zip

      - name: Cleanup
        if: always()
        run: docker rm -f termux

env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}